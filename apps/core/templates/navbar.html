{% load static %}
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<head>
    <title>{% block title %}My Site{% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="{% static 'bootstrap_5.3.8/css/bootstrap.min.css' %}" rel="stylesheet">
    <!-- Bootstrap JS (optional, for components like dropdowns) -->
    <script src="{% static 'bootstrap_5.3.8/js/bootstrap.bundle.min.js' %}"></script>
</head>

<body class="bg-black text-white">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark p-3">
    <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
                aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class=" collapse navbar-collapse" id="navbarNavDropdown">
            <ul class="navbar-nav ms-auto ">
                <li class="nav-item">
                    <a class="nav-link mx-2 {% if current_page == 'homepage' %}active{% endif %}" aria-current="page"
                       href="{% url 'homepage' %}">Home</a>
                </li>
                <li class="nav-item dropdown">
                        <a class="nav-link mx-2 dropdown-toggle {% if current_page == 'exercises' %}active{% endif %}" href="#" id="navbarDropdownMenuLink" role="button"
                           data-bs-toggle="dropdown" aria-expanded="false">
                            Exercises
                        </a>
                        <ul class="dropdown-menu" aria-labelledby="navbarDropdownMenuLink">
                            <li><a class="dropdown-item" href="{% url 'body_parts' %}">By body part</a></li>
                            <li><a class="dropdown-item" href="{% url 'muscles' %}">By muscle</a></li>
                            <li><a class="dropdown-item" href="exercises">All exercises</a></li>
                        </ul>
                </li>
                <li class="nav-item">
                    <a class="nav-link mx-2" href="#">APIs</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link mx-2" href="#">About</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

{% block content %}
{% endblock %}

</body>
