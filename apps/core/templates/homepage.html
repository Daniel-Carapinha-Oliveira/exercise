{% extends 'navbar.html' %}
{% load static %}

{% block title %}Homepage{% endblock %}

{% block content %}

<div class="container-fluid p-0">
    <div class="d-flex align-items-center justify-content-center text-center text-white bg-dark bg-opacity-50"
         style="background: url('{% static 'homepage/imgs/homepage_1.jpg' %}') no-repeat center center; background-size: cover; min-height: calc(100vh - 72px);">
        <div>
            <h1 class="display-1 fw-bold"> Welcome to Your Exercise Hub!</h1>
            <h3> Browse exercises to build your perfect workout</h3>
            <a href="{% url 'muscle_groups' %}" class="btn btn-primary btn-md m-3">Browse muscle groups</a>
            <a href="{% url 'exercises' %}" class="btn btn-primary btn-md m-3">Browse all exercises</a>
        </div>
    </div>
</div>

<div style="position:fixed; bottom:0; left:0; width:100%; background:#212529; color:white; padding:8px 12px; box-sizing:border-box; font-size:16px; font-weight:bold; z-index:1030;">
    Version: {{ version }}
</div>

{% endblock %}
