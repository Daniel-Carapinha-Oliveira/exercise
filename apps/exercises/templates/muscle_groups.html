{% extends "navbar.html" %}
{% load static %}

{% block title %}Muscle groups{% endblock %}

{% block content %}

<div class="container-lg text-center my-3">
    <div class="row m-3 justify-content-center">
        {% for muscle_group in muscle_groups %}
        <div class="col-sm-6 col-lg-3 mb-3 d-flex">
            <div class="card flex-fill d-flex flex-column">
                <img src="{{ muscle_group.image.url }}" class="card-img-top" style="height: 200px; width: 100%; object-fit: cover;" alt="{{ muscle_group.name }}">
                <div class="card-body d-flex flex-column justify-content-between">
                    <h5 class="card-title">{{ muscle_group.name }}</h5>
                    <div class="d-flex flex-grow-1 align-items-center justify-content-center mb-3">
                        <p class="card-text mb-0" style="text-align: justify;">{{ muscle_group.description }}</p>
                    </div>
                    <a href="{% url 'exercises' %}?muscle_group={{ muscle_group.id }}" class="btn btn-primary">See
                        Exercises</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
