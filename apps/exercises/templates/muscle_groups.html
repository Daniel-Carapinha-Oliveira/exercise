{% extends "navbar.html" %}
{% load static %}

{% block title %}Muscle groups{% endblock %}

{% block content %}

<div class="container-lg text-center my-3">
    <div class="row m-3 justify-content-center">
        {% for muscle_group in muscle_groups %}
        <div class="col-sm-6 col-lg-3 mb-3">
            <div class="card">
                <img src="{{ muscle_group.image.url }}" class="card-img-top" style="height: 200px; width: 100%; object-fit: cover;" alt="...">
                <div class="card-body">
                    <h5 class="card-title">{{ muscle_group.name }}</h5>
                    <p class="card-text">{{ muscle_group.description }}</p>
                    <a href="{% url 'exercises' %}?muscle_group={{ muscle_group.id }}" class="btn btn-primary">See
                        Exercises</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

{% endblock %}
