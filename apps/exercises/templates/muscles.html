{% extends "navbar.html" %}
{% load static %}

{% block content %}

    <div class="container-lg text-center my-3">
        <div class="row m-3">
            {% for muscle in muscles %}
            <div class="col">
                <div class="card" style="width: 18rem;">
                    <img src="{{ muscle.image.url }}" class="card-img-top" style="max-height: 200px;" alt="...">
                    <div class="card-body">
                        <h5 class="card-title">{{ muscle.name }}</h5>
                        <p class="card-text">{{ muscle.description }}</p>
                        <a href="{% url 'exercises' %}?muscle={{ muscle.id }}" class="btn btn-primary">See Exercises</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
     </div>

{% endblock %}
