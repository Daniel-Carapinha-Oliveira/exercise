{% extends "navbar.html" %}
{% load static %}

{% block content %}

    <div class="container-lg text-center my-3">
        <div class="row m-3 justify-content-center">
            {% for muscle in muscles %}
            <div class="col-sm-11 col-lg-3 mb-3">
            <div class="card">
                <img src="{{ muscle.image.url }}" class="card-img-top" style="height: 200px; width: 100%; object-fit: cover;" alt="...">
                    <div class="card-body">
                        <h5 class="card-title">{{ muscle.name }}</h5>
                        <p class="card-text">{{ muscle.description }}</p>
                        <a href="{% url 'exercises' %}?muscle={{ muscle.id }}" class="btn btn-primary">See Exercises</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
     </div>

{% endblock %}
