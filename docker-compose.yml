services:
  exercise:
    restart: unless-stopped
    build: .
    image: exercise:latest
    ports:
      - '8000:8000'
    container_name: exercise
    command: ./bin/boot_exercise.sh
    env_file: ./env/exercise.env
    depends_on:
      - db
    networks:
      - network

  db:
    restart: unless-stopped
    image: postgres
    container_name: exercise_db
    env_file: ./env/exercise_db.env
    volumes:
      - pgdb-data:/var/lib/postgresql/data
    networks:
      - network

volumes:
  pgdb-data:
    driver: local

networks:
  network:
    ipam:
      driver: default
      config:
        - subnet: '172.28.0.0/24'
